<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vực Lặng · Island review</title><style>*{box-sizing:border-box}body{margin:0;background:#102832;color:#e2f4ef;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}header,aside{position:fixed;left:16px;background:#08222de8;border:1px solid #699992;border-radius:6px;padding:12px}header{top:12px;right:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}aside{bottom:12px;max-width:690px;line-height:1.6}button,select{font:inherit;padding:7px 10px;background:#254b54;color:white;border:1px solid #7faaa0;border-radius:4px}small{display:block;color:#adcfc5}#status{white-space:pre-line;font-variant-numeric:tabular-nums}#error{color:#ffd295}</style><canvas id="view"></canvas><header><b>ISLAND / EXACT TERRAIN & ASSETS</b><button data-view="wide">Overview</button><button data-view="water">Water approach</button><button data-view="beach">Sandy beach</button><button data-view="forest">Mountain trail</button><button data-view="summit">Summit</button><button id="route">Walk actual route</button><button id="pause">Pause / resume</button><select id="quality" aria-label="Quality"><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></header><aside><div id="status">Preparing island…</div><div id="error"></div><small>Isolated review using the production terrain, Blender prototypes, arms and ground physics. View buttons set inspection poses. Route mode uses continuous physics from the shore. This is not the full mission or a performance benchmark.</small></aside><script type="module" src="./island-review.js"></script></html>
